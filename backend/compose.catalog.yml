services:
  backend:
    environment:
      APP_CATALOG_ENABLED: "true"
      APP_CATALOG_PATH: /app/data/catalog.json
    volumes:
      - type: bind
        source: ${CATALOG_FILE:?Set CATALOG_FILE to an absolute path to catalog.json}
        target: /app/data/catalog.json
        read_only: true
        bind:
          create_host_path: false
