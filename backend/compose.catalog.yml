services:
  backend:
    environment:
      APP_RECOMMENDATION_REVIEW_VERSION: ${REVIEWED_CATALOG_VERSION:-}
      APP_RECOMMENDATION_REVIEW_IDS: ${REVIEWED_MENU_IDS:-}
      APP_CATALOG_ENABLED: "true"
      APP_CATALOG_PATH: /app/data/catalog.json
    volumes:
      - type: bind
        source: ${CATALOG_FILE:-./backend/data/catalog/haenggung-2026-11-18.2/catalog.json}
        target: /app/data/catalog.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
    name: ${SUWON_DB_VOLUME:-suwon_trip_postgres_data}
