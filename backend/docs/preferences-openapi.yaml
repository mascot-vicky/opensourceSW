openapi: 3.0.3
info:
  title: 계정별 설문 답변
  version: 0.1.0
  description: 활성화된 설문 정의와 로그인 세션이 필요합니다. 예시는 6문항 v0.1.0 초안을 사용합니다.
security:
- sessionCookie: []
paths:
  /api/v1/me/preferences:
    get:
      summary: 내 마지막 설문 답변 조회
      operationId: getPreferences
      description: 저장된 버전이 현재 설문과 달라도 당시 답변을 그대로 반환합니다. 두 버전이 다르면 재설문을 안내합니다.
      responses:
        '200':
          description: 미저장 또는 마지막 저장 결과
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              examples:
                empty:
                  value:
                    saved: false
                    questionnaireVersion: null
                    answers: []
                    updatedAt: null
                saved:
                  value:
                    saved: true
                    questionnaireVersion: v0.1.0
                    answers:
                    - questionId: Q1
                      optionIds:
                      - B
                    - questionId: Q2
                      optionIds:
                      - B
                    - questionId: Q3
                      optionIds:
                      - C
                    - questionId: Q4
                      optionIds: []
                    - questionId: Q5
                      optionIds:
                      - B
                    - questionId: Q6
                      optionIds:
                      - C
                    updatedAt: '2026-11-26T04:30:00Z'
        '401':
          description: 로그인이 필요해요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: AUTHENTICATION_REQUIRED
                    message: 로그인이 필요해요.
                    errors: []
    put:
      summary: 내 설문 답변 전체 교체
      operationId: replacePreferences
      description: 버전마다 정의된 모든 문항을 한 번씩 보냅니다. v0.1.0에서 Q1이 A가 아니면 Q4는 빈 배열입니다. 422
        응답에서는 기존 답변이 유지됩니다.
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 현재 로그인 세션의 CSRF 토큰
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Submission'
            example:
              questionnaireVersion: v0.1.0
              answers:
              - questionId: Q1
                optionIds:
                - B
              - questionId: Q2
                optionIds:
                - B
              - questionId: Q3
                optionIds:
                - C
              - questionId: Q4
                optionIds: []
              - questionId: Q5
                optionIds:
                - B
              - questionId: Q6
                optionIds:
                - C
      responses:
        '200':
          description: 전체 저장 결과
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              examples:
                saved:
                  value:
                    saved: true
                    questionnaireVersion: v0.1.0
                    answers:
                    - questionId: Q1
                      optionIds:
                      - B
                    - questionId: Q2
                      optionIds:
                      - B
                    - questionId: Q3
                      optionIds:
                      - C
                    - questionId: Q4
                      optionIds: []
                    - questionId: Q5
                      optionIds:
                      - B
                    - questionId: Q6
                      optionIds:
                      - C
                    updatedAt: '2026-11-26T04:30:00Z'
        '400':
          description: 요청 형식을 확인해 주세요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: INVALID_REQUEST
                    message: 요청 형식을 확인해 주세요.
                    errors: []
        '401':
          description: 로그인이 필요해요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: AUTHENTICATION_REQUIRED
                    message: 로그인이 필요해요.
                    errors: []
        '403':
          description: 요청 확인 값을 다시 받아주세요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: CSRF_INVALID
                    message: 요청 확인 값을 다시 받아주세요.
                    errors: []
        '409':
          description: 현재 설문 버전을 확인해 주세요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: QUESTIONNAIRE_VERSION_MISMATCH
                    message: 현재 설문 버전을 확인해 주세요.
                    errors: []
        '422':
          description: 설문 응답을 확인해 주세요.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    code: INVALID_ANSWERS
                    message: 설문 응답을 확인해 주세요.
                    errors:
                    - field: answers[3].optionIds
                      questionId: Q4
                      reason: SELECTION_COUNT
                      message: 음료를 고르지 않으면 Q4는 빈 배열로 보내 주세요.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    Submission:
      type: object
      required:
      - questionnaireVersion
      - answers
      properties:
        questionnaireVersion:
          type: string
          minLength: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
      additionalProperties: false
    Preferences:
      type: object
      required:
      - saved
      - questionnaireVersion
      - answers
      - updatedAt
      properties:
        saved:
          type: boolean
        questionnaireVersion:
          type: string
          nullable: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        updatedAt:
          type: string
          format: date-time
          nullable: true
    Answer:
      type: object
      required:
      - questionId
      - optionIds
      properties:
        questionId:
          type: string
          minLength: 1
        optionIds:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
      additionalProperties: false
    AnswerError:
      type: object
      required:
      - field
      - questionId
      - reason
      - message
      properties:
        field:
          type: string
          minLength: 1
        questionId:
          type: string
          nullable: true
        reason:
          type: string
          enum:
          - MISSING_QUESTION
          - UNKNOWN_QUESTION
          - UNKNOWN_OPTION
          - DUPLICATE_QUESTION
          - DUPLICATE_OPTION
          - SELECTION_COUNT
        message:
          type: string
          minLength: 1
    Error:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/AnswerError'
